name: Lean CI

on:
  pull_request:
    paths:
      - 'formal-verification/lean/**'
      - 'formal-verification/tests/**'
  push:
    branches:
      - main
    paths:
      - 'formal-verification/lean/**'
      - 'formal-verification/tests/**'
  workflow_dispatch:

jobs:
  build:
    name: Verify Lean Proofs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formal-verification/lean

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Lean toolchain
        run: elan toolchain install $(cat lean-toolchain)

      - name: Show Lean version
        run: lean --version

      - name: Compute cache key
        id: cache-key
        run: echo "manifest_hash=$(sha256sum lake-manifest.json | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache .lake build artefacts
        uses: actions/cache@v4
        with:
          path: formal-verification/lean/.lake
          key: lean-lake-${{ steps.cache-key.outputs.manifest_hash }}
          restore-keys: lean-lake-

      - name: Resolve Lean dependencies (lake update)
        run: lake update

      - name: Build and verify all proofs
        run: |
          echo "=== lake build starting ==="
          lake build 2>&1 | tee /tmp/lake_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          SORRY_COUNT=$(grep -c 'sorry' /tmp/lake_build.log || true)
          echo ""
          echo "=== lake build exit code: $BUILD_EXIT ==="
          echo "=== 'sorry' occurrences in build output: $SORRY_COUNT ==="
          exit $BUILD_EXIT

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lake-build-log
          path: /tmp/lake_build.log

  correspondence-tests:
    name: Correspondence Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run atmosphere correspondence tests (26 cases)
        run: python3 formal-verification/tests/atmosphere/check_correspondence.py

      - name: Run slew_rate correspondence tests (4327 cases)
        run: python3 formal-verification/tests/slew_rate/check_correspondence.py

      - name: Run count_set_bits correspondence tests (871 cases)
        run: python3 formal-verification/tests/count_set_bits/check_correspondence.py

      - name: Run expo correspondence tests (1373 cases)
        run: python3 formal-verification/tests/expo/check_correspondence.py

      - name: Run pid correspondence tests (7964 cases)
        run: python3 formal-verification/tests/pid/check_correspondence.py

      - name: Run deadzone correspondence tests (1221 cases)
        run: python3 formal-verification/tests/deadzone/check_correspondence.py

      - name: Run BlockIntegralTrap correspondence tests (120 cases)
        run: python3 formal-verification/tests/BlockIntegralTrap/test_correspondence.py

      - name: Run LowPassFilter2p correspondence tests (28 cases)
        run: python3 formal-verification/tests/LowPassFilter2p/test_correspondence.py
